<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metro Map</title>
<style>
:root{--bg:#f4f5f7;--fg:#1c1e21;--card:#fff;--muted:#5f6368;--border:#d8dbe0}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e8eaed;--card:#22252a;--muted:#a0a4ab;--border:#3a3e45}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:1rem}
h1{font-size:1.4rem;margin:.5rem 0 1rem}
.map{background:#fff;border:1px solid var(--border);border-radius:12px;padding:.5rem;overflow-x:auto}
#metro-map{width:100%;min-width:640px;height:auto;display:block}
.station{cursor:pointer;outline:none}
.station .hit{fill:transparent}
.station:hover .hit,.station:focus-visible .hit{fill:rgba(8,150,215,.25);stroke:#0896d7;stroke-width:.15}
.station:hover text,.station:focus-visible text{text-decoration:underline}
dialog{border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--fg);padding:0;width:min(440px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.body{padding:1.25rem 1.5rem 1.5rem}
dialog img{width:100%;max-height:240px;object-fit:cover;display:block;border-radius:14px 14px 0 0}
dialog h2{margin:0 2rem .25rem 0;font-size:1.3rem}
.year{color:var(--muted);font-size:.9rem;margin:0 0 .75rem}
.badges{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.75rem}
.badge{padding:.1rem .65rem;border-radius:999px;font-size:.8rem;font-weight:600;color:#fff}
.close{position:absolute;top:.5rem;right:.6rem;border:0;background:rgba(0,0,0,.45);color:#fff;width:2rem;height:2rem;border-radius:50%;font-size:1.2rem;cursor:pointer}
p{margin:0}

<dialog id="dlg" aria-labelledby="d-name"><button class="close" aria-label="Close">&times;</button>
<img id="d-img" alt="" hidden><div class="body">
<h2 id="d-name"></h2><p class="year" id="d-year"></p><div class="badges" id="d-lines"></div><p id="d-desc"></p></div></dialog>
<script>
const dlg=document.getElementById('dlg');
const $=id=>document.getElementById(id);
function lum(hex){const n=parseInt(hex.slice(1),16);return .299*(n>>16)+.587*(n>>8&255)+.114*(n&255)}
fetch('stations.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{
  function open(id){
    const s=data.stations[id];if(!s)return;
    $('d-name').textContent=s.name;
    $('d-year').textContent=s.year||'';$('d-year').hidden=!s.year;
    $('d-desc').textContent=s.description||'';
    const img=$('d-img');
    if(s.image){img.src=s.image;img.alt=s.name;img.hidden=false}else{img.hidden=true;img.removeAttribute('src')}
    const b=$('d-lines');b.replaceChildren();
    (s.lines||[]).forEach(n=>{const c=data.lines[n]||'#666',e=document.createElement('span');
      e.className='badge';e.textContent=n;e.style.background=c;e.style.color=lum(c)>170?'#000':'#fff';b.append(e)});
    dlg.showModal();
  }
  document.querySelectorAll('.station').forEach(g=>{
    g.addEventListener('click',()=>open(g.id));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(g.id)}});
  });
}).catch(e=>console.error('Could not load stations.json (serve over HTTP, not file://)',e));
dlg.querySelector('.close').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
</script></body></html>
